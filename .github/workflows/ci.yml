name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: UI tests (axe accessibility, layout, share-card rendering)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  native:
    name: "Native (Windows - fmt, clippy, tests, app build)"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: rustfmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust tests (unit + real-scan integration)
        run: cargo test
        working-directory: src-tauri
      - name: Third-party license file is current
        run: node scripts/generate-licenses.mjs --check
      - name: Build the desktop app (no installer)
        run: npx tauri build --debug --no-bundle

  rust-audit:
    name: Rust advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
        working-directory: src-tauri
