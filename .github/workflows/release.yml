name: Release

# Runs when a version tag is pushed (for example v0.1.0-beta.1), or manually.
# It builds the Windows x64 installers and attaches them to a DRAFT release.
# Nothing is published automatically: a maintainer reviews the draft, then publishes it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the draft release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and run the full test suite
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG" ]; then
            echo "Tag ($TAG) does not match package.json version ($APP_VERSION)." >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
      - name: Third-party license file is current
        run: node scripts/generate-licenses.mjs --check

  build:
    name: Build Windows x64 installers
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build and create a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PC EXPOSED ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. Installers are unsigned: Windows SmartScreen may warn. Verify downloads against SHA256SUMS.txt."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-pc-windows-msvc
      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $files = Get-ChildItem -Path $dir -Recurse -Include *.exe | Where-Object { $_.FullName -match "bundle\\nsis\\" }
          if (-not $files) { throw "No installers found under $dir" }
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt
      - name: Attach checksums to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installers
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            SHA256SUMS.txt
