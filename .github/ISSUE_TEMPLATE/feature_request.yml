name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project principles
      description: PC EXPOSED is local-only, read-only and never fabricates data.
      options:
        - label: This does not require network access, telemetry or administrator rights
        - label: This does not need data the scanner can't actually read
